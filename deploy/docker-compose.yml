services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abyssmarket}
      POSTGRES_USER: ${POSTGRES_USER:-abyssmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: abyssmarket-server:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/usr/local/bin/migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-abyssmarket}:${POSTGRES_PASSWORD:-local-dev-password}@postgres:5432/${POSTGRES_DB:-abyssmarket}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: abyssmarket-server:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:3000
      DATABASE_URL: postgres://${POSTGRES_USER:-abyssmarket}:${POSTGRES_PASSWORD:-local-dev-password}@postgres:5432/${POSTGRES_DB:-abyssmarket}
      EXPEDITION_SECONDS_PER_DEPTH: ${EXPEDITION_SECONDS_PER_DEPTH:-60}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  expedition-worker:
    image: abyssmarket-server:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/usr/local/bin/expedition-worker"]
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:3000
      DATABASE_URL: postgres://${POSTGRES_USER:-abyssmarket}:${POSTGRES_PASSWORD:-local-dev-password}@postgres:5432/${POSTGRES_DB:-abyssmarket}
    depends_on:
      migrate:
        condition: service_completed_successfully

  client:
    image: abyssmarket-client:dev
    build:
      context: ../client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLIENT_HOST_PORT:-4173}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
